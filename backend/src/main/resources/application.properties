spring.application.name=backend
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/plantos
spring.datasource.username=plantos
spring.datasource.password=${PLANTOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Opt in when running the telemetry pipeline; the machine API also works without Kafka.
plantos.kafka.enabled=${PLANTOS_KAFKA_ENABLED:false}
plantos.kafka.anomaly-topic=plantos.machine.anomaly.v1
spring.kafka.bootstrap-servers=${PLANTOS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${PLANTOS_KAFKA_GROUP_ID:plantos-alerts-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
